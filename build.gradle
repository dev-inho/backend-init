import groovy.xml.XmlSlurper

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.2.21' apply false
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

def rootPathHasNonAscii = rootDir.absolutePath.any { it > '\u007F' }
def defaultExternalBuildRoot = new File(
    System.getProperty('java.io.tmpdir'),
    "backend-init-gradle-build-${Integer.toHexString(rootDir.absolutePath.hashCode())}"
).absolutePath
def externalBuildRoot = providers
    .gradleProperty('backendInitBuildRoot')
    .orElse(System.getenv('BACKEND_INIT_BUILD_ROOT') ?: defaultExternalBuildRoot)

allprojects {
    group = 'cc.midolog'
    version = '0.0.1-SNAPSHOT'

    if (rootPathHasNonAscii) {
        def safeProjectName = path == ':' ? 'root' : path.substring(1).replace(':', '-')
        layout.buildDirectory = file("${externalBuildRoot.get()}/${safeProjectName}")
    }

    repositories {
        mavenCentral()
        maven { url = 'https://repo.spring.io/milestone' }
    }
}

subprojects {
    if (path == ':platform:bom') {
        return
    }
    apply plugin: 'org.jetbrains.kotlin.jvm'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    kotlin {
        compilerOptions {
            freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
        }
    }

    dependencies {
        implementation 'org.jetbrains.kotlin:kotlin-reflect'
        testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.matching { it.name == 'test' }.configureEach {
        useJUnitPlatform()
    }
}

tasks.register('verifyBom') {
    group = 'verification'
    description = 'Verifies that the published BOM contains dependency constraints for all 11 target modules.'
    dependsOn('publishAllToLocalRepo')

    doLast {
        def repoBaseDir = project.findProperty('backendInitRepo') ?
            file(project.property('backendInitRepo')) :
            file('build/repo')

        def bomDir = new File(repoBaseDir, 'cc/midolog/backend-init-bom/0.0.1-SNAPSHOT')
        if (!bomDir.exists()) {
            throw new GradleException("BOM publication directory not found at: ${bomDir.absolutePath}")
        }

        def pomFiles = bomDir.listFiles({ dir, name -> name.endsWith('.pom') } as FilenameFilter)
        if (!pomFiles || pomFiles.length == 0) {
            throw new GradleException("BOM POM file not found in: ${bomDir.absolutePath}")
        }
        def bomPom = pomFiles.max { it.lastModified() }

        def pomXml = new XmlSlurper().parse(bomPom)
        def actualArtifacts = pomXml.dependencyManagement.dependencies.dependency.collect { it.artifactId.text() } as Set

        def expectedArtifacts = [
            'backend-init-domain',
            'backend-init-support-util',
            'backend-init-support-logging',
            'backend-init-support-web',
            'backend-init-support-jwt',
            'backend-init-storage-jpa',
            'backend-init-storage-mybatis',
            'backend-init-storage-file-local',
            'backend-init-gateway-core',
            'backend-init-gateway-autoconfigure',
            'backend-init-gateway-starter'
        ] as Set

        if (actualArtifacts != expectedArtifacts) {
            def missing = expectedArtifacts - actualArtifacts
            def unexpected = actualArtifacts - expectedArtifacts
            throw new GradleException("BOM validation failed! Missing: ${missing}, Unexpected: ${unexpected}. Actual: ${actualArtifacts}")
        }

        logger.lifecycle("BOM verification passed! All ${expectedArtifacts.size()} target modules present in BOM dependencyManagement.")
    }
}

tasks.register('verifyArtifacts', Exec) {
    group = 'verification'
    description = 'Publishes all artifacts to local repo and executes consumer test suite.'
    dependsOn('publishAllToLocalRepo')

    workingDir = rootDir
    def execArgs = ['./gradlew', '-p', 'examples/artifact-consumer', 'test']
    if (project.hasProperty('backendInitRepo')) {
        execArgs += ["-PbackendInitRepo=${project.property('backendInitRepo')}"]
    }
    commandLine execArgs
}