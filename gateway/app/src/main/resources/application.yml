server:
  port: 8080

spring:
  application:
    name: backend-gateway

gateway:
  mode: standalone
  routes:
    application-url: ${GATEWAY_APPLICATION_URL}
    application-urls: ${GATEWAY_APPLICATION_URLS:}
    batch-url: ${GATEWAY_BATCH_URL}
  rate-limit:
    auth-token:
      limit: 10
      window-seconds: 60
  request-visibility:
    enabled: false
    capacity: 200

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
