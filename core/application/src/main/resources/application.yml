server:
  port: 8081

spring:
  application:
    name: backend-application
  data:
    jpa:
      repositories:
        enabled: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET}

---
spring:
  config:
    activate:
      on-profile: jpa
  data:
    jpa:
      repositories:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
storage:
  file:
    provider: local
    local:
      root-dir: ${STORAGE_FILE_ROOT_DIR:${user.dir}/build/files}
