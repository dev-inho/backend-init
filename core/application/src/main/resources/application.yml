server:
  port: 8081

spring:
  application:
    name: backend-application
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET}

gateway:
  mode: embedded
  rate-limit:
    auth-token:
      limit: 10
      window-seconds: 60
  request-visibility:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
storage:
  file:
    provider: local
    local:
      root-dir: ${STORAGE_FILE_ROOT_DIR:${user.dir}/build/files}
gateway:
  request-visibility:
    enabled: true
