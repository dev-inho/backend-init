plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cc.midolog.examples'
version = '0.0.1-SNAPSHOT'

def backendInitVersion = project.findProperty('backendInitVersion') ?: '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

repositories {
    if (project.hasProperty('backendInitRepoUrl')) {
        def rawUrl = project.property('backendInitRepoUrl').toString()
        def repoUri = uri(rawUrl)

        def scheme = repoUri.scheme?.toLowerCase()
        def host = repoUri.host?.toLowerCase()
        def path = repoUri.path?.replaceAll('/+$', '')

        def allowTest = project.hasProperty('allowInsecureTestUrl') &&
            Boolean.parseBoolean(project.property('allowInsecureTestUrl').toString()) &&
            (host == '127.0.0.1' || host == 'localhost')

        if (!allowTest) {
            if (scheme != 'https') {
                throw new GradleException("Security violation: backendInitRepoUrl must use HTTPS scheme to prevent credential leakage. Got: $rawUrl")
            }
            if (host != 'maven.pkg.github.com') {
                throw new GradleException("Security violation: backendInitRepoUrl host must be maven.pkg.github.com to prevent token leakage. Got: $rawUrl")
            }
            if (repoUri.rawUserInfo != null || repoUri.userInfo != null) {
                throw new GradleException("Security violation: backendInitRepoUrl must not contain user credentials (userInfo). Got: $rawUrl")
            }
            if (repoUri.rawQuery != null || repoUri.query != null) {
                throw new GradleException("Security violation: backendInitRepoUrl must not contain query parameters. Got: $rawUrl")
            }
            if (repoUri.rawFragment != null || repoUri.fragment != null) {
                throw new GradleException("Security violation: backendInitRepoUrl must not contain fragment. Got: $rawUrl")
            }
            if (repoUri.port != -1 && repoUri.port != 443) {
                throw new GradleException("Security violation: backendInitRepoUrl must use standard HTTPS port (443). Got: $rawUrl")
            }
            if (path != '/dev-inho/backend-init') {
                throw new GradleException("Security violation: backendInitRepoUrl repository path must be /dev-inho/backend-init. Got: $rawUrl")
            }
        }

        // 원격 저장소가 명시적으로 지정된 경우: 로컬 build/repo fallback을 완전히 차단하고 원격 레지스트리만 등록
        maven {
            url = repoUri
            credentials {
                username = project.findProperty('gpr.user') ?:
                    System.getenv('GITHUB_ACTOR') ?:
                    System.getenv('GITHUB_USERNAME') ?:
                    'dev-inho'
                password = project.findProperty('gpr.key') ?:
                    System.getenv('GITHUB_TOKEN') ?:
                    System.getenv('GH_TOKEN') ?:
                    ''
            }
        }
    } else {
        // 로컬 저장소 모드: build/repo 경로를 명시적으로 등록
        def localRepoDir = project.findProperty('backendInitRepo') ?
            file(project.property('backendInitRepo')) :
            file("$rootDir/../../build/repo")
        maven {
            url = localRepoDir.toURI()
        }
    }
    mavenCentral()
    maven { url = 'https://repo.spring.io/milestone' }
}

dependencies {
    implementation(platform("cc.midolog:backend-init-bom:${backendInitVersion}"))

    implementation("cc.midolog:backend-init-domain")
    implementation("cc.midolog:backend-init-support-web")
    runtimeOnly("cc.midolog:backend-init-storage-jpa")
    runtimeOnly("cc.midolog:backend-init-storage-mybatis")

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor'
    implementation 'tools.jackson.module:jackson-module-kotlin'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}
