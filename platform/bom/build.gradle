plugins {
    id 'java-platform'
    id 'cc.midolog.publishing'
}

javaPlatform {
    allowDependencies()
}

dependencies {
    constraints {
        api project(':core:domain')
        api project(':support:util')
        api project(':support:logging')
        api project(':support:web')
        api project(':support:jwt')
        api project(':storage:jpa')
        api project(':storage:mybatis')
        api project(':storage:file-local')
        api project(':gateway:core')
        api project(':gateway:autoconfigure')
        api project(':gateway:starter')
    }
}
